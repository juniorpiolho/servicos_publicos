version: '3.8'

services:
  backend:
    build:
      dockerfile: Dockerfile
    environment:
      DATABASE_NAME: servicos
      DATABASE_USER: adm
      DATABASE_PASSWORD: adm123
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:alpine 
    environment:
      POSTGRES_DB: servicos 
      POSTGRES_USER: adm 
      POSTGRES_PASSWORD: adm123 
    ports:
      - "5432:5432" 
    volumes:
      - db_data:/var/lib/postgresql/data 

volumes:
  db_data: 